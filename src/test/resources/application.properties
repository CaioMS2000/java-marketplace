spring.application.name=java-marketplace

# Test config is isolated from the runtime .env: this file shadows the main
# application.properties on the test classpath. Datasource comes from
# Testcontainers (@ServiceConnection); secrets come from .env.test.
spring.config.import=optional:file:.env.test[.properties]

security.token.secret=${JWT_SECRET}
security.token.roles-claim=roles

spring.jpa.hibernate.ddl-auto=validate
